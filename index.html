<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<link rel="manifest" href="map-manifest.json">
<meta name="theme-color" content="#1d4ed8">
<link rel="apple-touch-icon" href="map-icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>거래처 지도 (신당·을지로)</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#111;background:#f4f5f7}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid #d1d5db}
h1{margin:0 12px 0 0;font-size:24px}
#q{font-size:18px;padding:10px 12px;border:1px solid #9ca3af;border-radius:8px;width:260px}
.f{font-size:17px;padding:10px 16px;border-radius:8px;border:1px solid #9ca3af;background:#fff;cursor:pointer;min-height:44px}
.f.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
#status{font-size:16px;color:#374151}
main{display:flex;height:calc(100vh - 70px)}
#list{width:380px;overflow-y:auto;background:#fff;border-right:1px solid #d1d5db}
.it{padding:12px 14px;border-bottom:1px solid #e5e7eb;cursor:pointer}
.it:hover,.it.sel{background:#eff6ff}
.nm{font-size:18px;font-weight:700}
.ad{font-size:15px;color:#374151;margin-top:4px}
.tg{display:inline-block;font-size:13px;padding:2px 8px;border-radius:10px;color:#fff;margin-right:6px}
.t신당{background:#1d4ed8}.t을지로{background:#c2410c}
.miss{color:#b91c1c;font-size:13px}
#map{flex:1}
.fix{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.fix input{font-size:16px;padding:8px 10px;border:1px solid #9ca3af;border-radius:6px;width:100%}
.fix .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fix button{font-size:16px;padding:8px 14px;border-radius:6px;border:none;background:#1d4ed8;color:#fff;cursor:pointer;min-height:40px}
.fix a{font-size:15px}
.fixmsg{font-size:14px}
.iw{padding:10px 12px;font-size:15px;line-height:1.5;min-width:240px}
.iw b{font-size:17px}
.iw .km{margin-top:6px;padding:6px 8px;background:#fffbea;border-left:4px solid #facc15;font-size:14px;white-space:pre-wrap;max-width:300px}
.kt{display:inline-block;margin-left:6px;font-size:13px;padding:2px 8px;border-radius:10px;background:#fee500;color:#191919;font-weight:700}
.ksend{padding:12px 14px;border-bottom:2px solid #e5e7eb}
.ksend .msg{margin:6px 0;padding:8px 10px;background:#fffbea;border-radius:8px;font-size:16px;white-space:pre-wrap}
.ksend .when{font-size:13px;color:#6b7280}
.ksend input{font-size:16px;padding:8px 10px;border:1px solid #9ca3af;border-radius:6px;width:100%;margin-top:6px;box-sizing:border-box}
.ksend button{margin-top:6px;font-size:16px;padding:8px 14px;border-radius:6px;border:none;background:#1d4ed8;color:#fff;cursor:pointer;min-height:40px}
.iw button.navi{margin:8px 0 4px;padding:10px 16px;font-size:17px;font-weight:700;border:none;border-radius:8px;background:#fee500;color:#191919;cursor:pointer;min-height:44px}
.iw a.tel{display:inline-block;margin:2px 0;padding:4px 10px;border-radius:6px;background:#dcfce7;color:#166534;font-weight:700;text-decoration:none}
#tabs{display:none}
@media(max-width:800px){
header{padding:8px 10px;gap:6px}
h1{font-size:20px;margin:0 6px 0 0}
header label[for=q]{display:none}
#q{width:100%;order:9;font-size:17px;padding:8px 10px}
.f,#missbtn{font-size:15px !important;padding:6px 10px !important;min-height:38px !important}
#status{font-size:14px;width:100%;order:10}
#tabs{display:flex;border-bottom:1px solid #d1d5db;background:#fff}
#tabs button{flex:1;font-size:18px;font-weight:700;padding:12px 0;border:none;background:#fff;color:#6b7280;border-bottom:3px solid transparent;cursor:pointer}
#tabs button.on{color:#1d4ed8;border-bottom-color:#1d4ed8}
main{display:block;height:calc(100vh - 200px)}
#list{width:100%;height:100%;border-right:none}
#map{width:100%;height:100%}
body.tab-list #map{display:none}
body.tab-map #list{display:none}
}
</style>
</head>
<body class="tab-list">
<header>
<h1>거래처 지도</h1>
<label for="q" style="font-size:16px">검색</label>
<input id="q" placeholder="거래처명·대표자·주소">
<button class="f on" data-g="전체">전체</button>
<button class="f" data-g="신당">신당</button>
<button class="f" data-g="을지로">을지로</button>
<button id="missbtn" style="font-size:17px;padding:10px 16px;border-radius:8px;border:1px solid #b91c1c;background:#fff;cursor:pointer;min-height:44px;border-color:#b91c1c;color:#b91c1c">위치 못 찾음만 보기</button>
<button id="kakaobtn" style="display:none;font-size:16px;padding:8px 14px;border-radius:8px;border:none;background:#fee500;color:#191919;cursor:pointer;min-height:40px;font-weight:700">새 카톡 (0)</button>
<button id="installbtn" style="display:none;font-size:16px;padding:8px 14px;border-radius:8px;border:none;background:#16a34a;color:#fff;cursor:pointer;min-height:40px;font-weight:700">홈 화면에 추가</button>
<span id="status">준비</span>
</header>
<div id="login" style="position:fixed;inset:0;background:#f4f5f7;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center">
<h2 style="margin:0;font-size:26px">거래처 지도</h2>
<p style="margin:0;font-size:18px">회사 구글 계정(@gagucafe114.com)으로 로그인해 주세요.</p>
<div id="gbtn"></div>
<p id="loginmsg" style="margin:0;font-size:16px;color:#b91c1c"></p>
</div>
<div id="tabs"><button data-tab="list" class="on">목록</button><button data-tab="map">지도</button></div>
<datalist id="clist"></datalist>
<main><div id="list"></div><div id="map"></div></main>
<script>
var DATA = [];
var GOOGLE_CLIENT_ID = '110271893577-dhusip1o4sb2rr927imrejjckk5i58ea.apps.googleusercontent.com';
var GAS_URL = 'https://script.google.com/macros/s/AKfycbx9czKwhVMCZ_9dCdI0pC4vcluY-NC0q88FdO4GIagNyAJ2AMTzJqpVwBWhzEM7cNQz/exec';
function gas(body){ return fetch(GAS_URL, { method: 'POST', body: JSON.stringify(body), redirect: 'follow', cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(j){ if (!j.ok) throw Error(j.error || '응답 오류'); return j; }); }
var TOKEN = '', onlyMiss = false;
var API_KAKAO = '';
var KMSGS = [], KLINKS = {}, kakaoView = false;
function kakaoCall(body){
  return fetch(API_KAKAO, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN }, body: JSON.stringify(body), credentials: 'omit', cache: 'no-store' })
    .then(function(r){ return r.json().then(function(j){ if (!r.ok || !j.ok) throw Error(j.error || ('응답 오류 ' + r.status)); return j; }); });
}
function loadKakao(){
  return;
  kakaoCall({ action: 'list' }).then(function(j){
    KMSGS = (j.msgs || []).filter(function(m){ return !/^TEST/.test(m.userKey); });
    KLINKS = {}; (j.links || []).forEach(function(l){ if (l.code !== 'TEST') KLINKS[l.userKey] = l.code; });
    if (!document.querySelector('.ksend input:focus')) render();
  }).catch(function(){ document.getElementById('kakaobtn').textContent = '카톡 불러오기 실패'; });
}
function msgsOfCode(code){ return KMSGS.filter(function(m){ return KLINKS[m.userKey] === code; }); }
function unlinkedSenders(){
  var by = {}; KMSGS.forEach(function(m){ if (!KLINKS[m.userKey]) { (by[m.userKey] = by[m.userKey] || []).push(m); } });
  return Object.keys(by).map(function(k){ return { userKey: k, msgs: by[k] }; }).sort(function(a, b){ return a.msgs[0].at < b.msgs[0].at ? 1 : -1; });
}
function fmtAt(s){ return String(s || '').slice(5, 16).replace('-', '/'); }

var mapReady = false, dataReady = false;
function onGoogle(resp){
  var msg = document.getElementById('loginmsg');
  msg.style.color = '#374151'; msg.textContent = '회사 계정 확인 중…';
  gas({ token: resp.credential, action: 'list' })
    .then(function(j){
      TOKEN = resp.credential; DATA = j.rows || []; dataReady = true;
      document.getElementById('clist').innerHTML = DATA.map(function(x){ return '<option value="'+esc(x.n)+'">'; }).join('');
      document.getElementById('login').style.display = 'none';
      try { var p = JSON.parse(atob(resp.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); setTimeout(function(){ location.reload(); }, Math.max(60000, p.exp*1000 - Date.now())); } catch (e) {}
      fitMain(); start(); loadKakao();
    })
    .catch(function(e){ msg.style.color = '#b91c1c'; msg.textContent = '로그인 실패: ' + e.message; });
}
function initGoogle(){
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogle, auto_select: true, hd: 'gagucafe114.com', use_fedcm_for_button: true });
  google.accounts.id.renderButton(document.getElementById('gbtn'), { type: 'standard', theme: 'outline', size: 'large', text: 'signin_with', locale: 'ko', width: 300 });
  google.accounts.id.prompt();
}

function startNavi(code){
  var d = DATA.filter(function(x){ return x.code === code; })[0]; if (!d || !cache[code]) return;
  var st = document.getElementById('status');
  if (!/Android|iPhone|iPad/i.test(navigator.userAgent)) { st.textContent = '⚠ 길안내는 핸드폰에서 눌러야 열립니다'; return; }
  var lat = cache[code][0], lng = cache[code][1];
  var left = false;
  document.addEventListener('visibilitychange', function h(){ if (document.hidden) { left = true; document.removeEventListener('visibilitychange', h); } });
  location.href = 'kakaomap://route?ep=' + lat + ',' + lng + '&by=CAR';
  setTimeout(function(){ if (!left && !document.hidden) { location.href = 'https://map.kakao.com/link/to/' + encodeURIComponent(d.n) + ',' + lat + ',' + lng; } }, 1800);
}
var gs = document.createElement('script'); gs.src = 'https://accounts.google.com/gsi/client'; gs.async = true; gs.onload = initGoogle;
gs.onerror = function(){ document.getElementById('loginmsg').textContent = '구글 로그인 버튼을 불러오지 못했습니다. 새로고침해 주세요.'; };
document.head.appendChild(gs);
function start(){ if (mapReady && dataReady) geocodeAll(0); }
var KEY = '6578a3cb2998b7b15d7605eae26170c3';
var CACHE_KEY = 'odin_client_geo_v1';
var cache = {}; try { cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); } catch (e) {}
function saveCache(){ try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch (e) {} }
var map, geocoder, clusterer, iw, group = '전체', selCode = null;
var s = document.createElement('script');
s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + KEY + '&libraries=services,clusterer&autoload=false';
s.onload = function(){ kakao.maps.load(init); };
s.onerror = function(){ document.getElementById('status').textContent = '❌ 지도 불러오기 실패 (도메인 등록 확인)'; };
document.head.appendChild(s);

function init(){
  map = new kakao.maps.Map(document.getElementById('map'), { center: new kakao.maps.LatLng(37.5665, 127.0120), level: 5 });
  geocoder = new kakao.maps.services.Geocoder();
  clusterer = new kakao.maps.MarkerClusterer({ map: map, averageCenter: true, minLevel: 4 });
  iw = new kakao.maps.InfoWindow({ removable: true });
  mapReady = true; fitMain(); start();
}
function cleanAddr(a){ return a.replace(/\s*\(.*?\)\s*/g,' ').replace(/,.*$/,'').replace(/\s+/g,' ').trim(); }
function geocodeAll(i){
  var st = document.getElementById('status');
  if (i >= DATA.length){ saveCache(); var miss = DATA.filter(function(d){return !cache[d.code];}).length; st.textContent = '✅ 완료 · ' + (DATA.length - miss) + '곳 표시' + (miss ? ' / 위치 못 찾음 ' + miss + '곳' : ''); render(); return; }
  var d = DATA[i];
  st.textContent = '⏳ 주소 → 위치 변환 ' + (i+1) + ' / ' + DATA.length;
  if (cache[d.code]) { geocodeAll(i+1); return; }
  geocoder.addressSearch(cleanAddr(d.a), function(r, status){
    if (status === kakao.maps.services.Status.OK){ cache[d.code] = [ +r[0].y, +r[0].x ]; geocodeAll(i+1); }
    else geocoder.addressSearch(d.a, function(r2, st2){ if (st2 === kakao.maps.services.Status.OK) cache[d.code] = [ +r2[0].y, +r2[0].x ]; setTimeout(function(){ geocodeAll(i+1); }, 30); });
  });
}
function esc(t){ return String(t||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function numOf(name){ var m = String(name).match(/^\s*(\d+)/); return m ? parseInt(m[1], 10) : 100000; }
function visible(){
  var q = document.getElementById('q').value.trim();
  return DATA.slice().sort(function(x, y){
    var a = numOf(x.n), b = numOf(y.n);
    if (a !== b) return a - b;
    return x.n.localeCompare(y.n, 'ko');
  }).filter(function(d){ return (!onlyMiss || !cache[d.code]) && (group==='전체'||d.g===group) && (!q || (d.n+d.ceo+d.a).indexOf(q) >= 0); });
}
function renderKakao(){
  var list = unlinkedSenders(), html = '<div class="it" style="background:#fffbea"><b>새 카톡</b> — 보낸 거래처를 한 번만 골라 연결하면 다음부터 자동으로 그 거래처에 붙습니다</div>';
  if (!list.length) html += '<div class="it">새로 연결할 카톡이 없습니다.</div>';
  list.forEach(function(s){
    html += '<div class="ksend"><div class="when">보낸 사람 #'+esc(s.userKey.slice(-6))+' · 메시지 '+s.msgs.length+'건</div>';
    s.msgs.slice(0, 5).forEach(function(m){ html += '<div class="msg"><span class="when">'+esc(fmtAt(m.at))+'</span>\n'+esc(m.text)+'</div>'; });
    html += '<input list="clist" aria-label="거래처 고르기" placeholder="거래처명 입력해서 고르기"><button data-link="'+esc(s.userKey)+'">이 거래처로 연결</button><div class="fixmsg"></div></div>';
  });
  document.getElementById('list').innerHTML = html;
}
function render(){
  var kb = document.getElementById('kakaobtn'), un = unlinkedSenders().length;
  kb.textContent = kakaoView ? '거래처 목록 보기' : ('새 카톡 (' + un + ')');
  if (kakaoView) { renderKakao(); return; }
  var rows = visible(), html = '', markers = [];
  rows.forEach(function(d){
    var pos = cache[d.code];
    html += '<div class="it'+(d.code===selCode?' sel':'')+'" data-c="'+esc(d.code)+'"><div class="nm"><span class="tg t'+esc(d.g)+'">'+esc(d.g)+'</span>'+esc(d.n)+(msgsOfCode(d.code).length?'<span class="kt">카톡 '+msgsOfCode(d.code).length+'</span>':'')+'</div><div class="ad">'+esc(d.a)+'</div>'+(pos?'':'<div class="miss">위치 못 찾음 — 아래에서 주소를 고쳐 저장하세요</div><div class="fix" data-fix="1"><input aria-label="새 주소" value="'+esc(cleanAddr(d.a))+'"><div class="row"><button data-save="'+esc(d.code)+'">주소 저장</button><a target="_blank" href="https://map.kakao.com/?q='+encodeURIComponent(d.n.replace(/^[0-9]+\./,'').replace(/[\(/].*$/,''))+'">카카오맵에서 상호 찾아보기</a></div><div class="fixmsg"></div></div>')+'</div>';
    if (pos && clusterer){
      var m = new kakao.maps.Marker({ position: new kakao.maps.LatLng(pos[0], pos[1]), title: d.n });
      kakao.maps.event.addListener(m, 'click', function(){ openInfo(d, m); });
      d._m = m; markers.push(m);
    }
  });
  document.getElementById('list').innerHTML = html || '<div class="it">검색 결과 없음</div>';
  if (clusterer){ clusterer.clear(); clusterer.addMarkers(markers); }
  var mc = DATA.filter(function(x){ return !cache[x.code]; }).length;
  document.getElementById('missbtn').textContent = onlyMiss ? '전체 목록 보기' : ('위치 못 찾음만 보기 (' + mc + ')');
}
function telLinks(s){
  s = String(s || '').trim(); if (!s || s === '0') return '-';
  var nums = s.match(/0\d{1,2}-?\d{3,4}-?\d{4}/g);
  if (!nums) return esc(s);
  return nums.map(function(n){ return '<a class="tel" href="tel:' + n.replace(/-/g,'') + '">' + esc(n) + '</a>'; }).join(' ');
}
function openInfo(d, m){
  selCode = d.code;
  iw.setContent('<div class="iw"><b>'+esc(d.n)+'</b><br>대표: '+esc(d.ceo||'-')+'<br>핸드폰: '+telLinks(d.hp)+'<br>전화: '+telLinks(d.tel)+'<br>'+esc(d.a)+(d.memo?'<br>비고: '+esc(d.memo):'')+msgsOfCode(d.code).slice(0,3).map(function(m){ return '<div class="km">'+esc(fmtAt(m.at))+'  '+esc(m.text)+'</div>'; }).join('')+'<br><button class="navi" onclick="startNavi(\''+esc(d.code)+'\')">카카오맵으로 길안내</button><br><a target="_blank" href="https://map.kakao.com/link/to/'+encodeURIComponent(d.n)+','+cache[d.code][0]+','+cache[d.code][1]+'">카카오맵 길찾기</a></div>');
  iw.open(map, m);
  document.querySelectorAll('.it').forEach(function(e){ e.classList.toggle('sel', e.getAttribute('data-c')===d.code); });
}
document.getElementById('list').addEventListener('click', function(e){
  var lb = e.target.closest('[data-link]');
  if (lb) { linkSender(lb); return; }
  if (e.target.closest('.ksend')) return;
  var sb = e.target.closest('[data-save]');
  if (sb) { saveAddr(sb); return; }
  if (e.target.closest('[data-fix]')) return;
  var it = e.target.closest('.it'); if (!it) return;
  var d = DATA.filter(function(x){ return x.code === it.getAttribute('data-c'); })[0];
  if (!d || !cache[d.code] || !map) return;
  if (isPhone()) showTab('map');
  map.setLevel(2); map.panTo(new kakao.maps.LatLng(cache[d.code][0], cache[d.code][1]));
  openInfo(d, d._m);
});
document.getElementById('q').addEventListener('input', render);
function showTab(name){
  document.body.classList.remove('tab-list','tab-map'); document.body.classList.add('tab-' + name);
  document.querySelectorAll('#tabs button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-tab') === name); });
  if (name === 'map' && map) { map.relayout(); }
}
function isPhone(){ return window.matchMedia('(max-width:800px)').matches; }
document.querySelectorAll('#tabs button').forEach(function(b){ b.addEventListener('click', function(){ showTab(b.getAttribute('data-tab')); }); });
function fitMain(){ var m = document.querySelector('main'); if (isPhone()) { m.style.height = (window.innerHeight - m.getBoundingClientRect().top) + 'px'; } else { m.style.height = ''; } if (map) map.relayout(); }
window.addEventListener('resize', fitMain);
document.getElementById('kakaobtn').addEventListener('click', function(){ kakaoView = !kakaoView; if (isPhone()) showTab('list'); render(); loadKakao(); });
function linkSender(btn){
  var box = btn.closest('.ksend'), val = box.querySelector('input').value.trim(), msg = box.querySelector('.fixmsg');
  var d = DATA.filter(function(x){ return x.n === val; })[0];
  if (!d) { msg.style.color = '#b91c1c'; msg.textContent = '목록에서 거래처 이름을 정확히 골라 주세요.'; return; }
  btn.disabled = true; msg.style.color = '#374151'; msg.textContent = '⏳ 연결 저장 준비';
  kakaoCall({ action: 'link', userKey: btn.getAttribute('data-link'), code: d.code }).then(function(){
    KLINKS[btn.getAttribute('data-link')] = d.code; render();
    document.getElementById('status').textContent = '✅ ' + d.n + ' 카톡 연결 완료';
  }).catch(function(e){ btn.disabled = false; msg.style.color = '#b91c1c'; msg.textContent = '❌ ' + e.message; });
}
document.getElementById('missbtn').addEventListener('click', function(){ onlyMiss = !onlyMiss; render(); });
function saveAddr(btn){
  var code = btn.getAttribute('data-save'), box = btn.closest('.fix'), input = box.querySelector('input'), msg = box.querySelector('.fixmsg');
  var a = input.value.replace(/\s+/g,' ').trim();
  var d = DATA.filter(function(x){ return x.code === code; })[0]; if (!d) return;
  if (a.length < 5) { msg.style.color = '#b91c1c'; msg.textContent = '주소를 더 자세히 입력해 주세요.'; return; }
  btn.disabled = true; msg.style.color = '#374151'; msg.textContent = '⏳ 위치 확인 준비';
  geocoder.addressSearch(a, function(r, st){
